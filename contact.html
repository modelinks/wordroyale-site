<!DOCTYPE html>
<html lang="ja">
<head>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <title>お問い合わせ - ワードロワイヤル</title>
</head>
<body>
    <div class="header">
        <a class="back" href="./">← ワードロワイヤル サポート</a>
        <h1>お問い合わせ</h1>
    </div>

    <div class="content">
        <p>ご質問・ご要望・不具合のご報告は、メールでお送りください。</p>

        <a href="mailto:contact@reqme.jp?subject=%E3%83%AF%E3%83%BC%E3%83%89%E3%83%AD%E3%83%AF%E3%82%A4%E3%83%A4%E3%83%AB%E3%81%AB%E3%81%A4%E3%81%84%E3%81%A6" class="contact-card">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </div>
            <div>
                <div class="title">メール</div>
                <div class="desc">contact@reqme.jp</div>
            </div>
        </a>
        <p class="note">返信まで数日いただくことがあります。</p>

        <h2>お問い合わせのときのお願い</h2>
        <ul>
            <li>iPhoneの機種・iOSのバージョンと、アプリのバージョン（設定の下のほうに出ます）をお知らせください。</li>
            <li>不具合のときは、いつ・どの画面で・何をしたら起きたかを書いていただけると助かります。スクリーンショットもあると確実です。</li>
            <li>問題の誤りは、問題文と答えを添えてください。</li>
        </ul>
    </div>

    <footer>&copy; 2026 ワードロワイヤル運営</footer>
