<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="早押しカタカナクイズバトル「ワードロワイヤル」のサポートページです。">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <title>ワードロワイヤル サポート</title>
</head>
<body>
    <div class="hero">
        <img class="icon" src="app_icon.png" alt="ワードロワイヤルのアイコン">
        <h1>ワードロワイヤル</h1>
        <p class="lead">早押しカタカナクイズバトル</p>
        <span class="badge soon">App Store で近日公開</span>
    </div>

    <div class="cards">
        <a href="help" class="card">
            <div class="card-icon gold">🎮</div>
            <div class="card-body">
                <h3>遊び方・よくある質問</h3>
                <p>ルール、ランク、フレンド、データについて</p>
            </div>
            <span class="arrow">›</span>
        </a>
        <a href="contact" class="card">
            <div class="card-icon red">💬</div>
            <div class="card-body">
                <h3>お問い合わせ</h3>
                <p>ご質問・ご要望・不具合のご報告</p>
            </div>
            <span class="arrow">›</span>
        </a>
        <a href="terms" class="card">
            <div class="card-icon blue">📋</div>
            <div class="card-body">
                <h3>利用規約</h3>
                <p>アプリを使うときの条件</p>
            </div>
            <span class="arrow">›</span>
        </a>
        <a href="privacy" class="card">
            <div class="card-icon green">🔒</div>
            <div class="card-body">
                <h3>プライバシーポリシー</h3>
                <p>情報の取り扱いについて</p>
            </div>
            <span class="arrow">›</span>
        </a>
    </div>

    <footer>&copy; 2026 ワードロワイヤル運営</footer>
</body>
</html>
